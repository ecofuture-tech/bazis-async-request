# What the package is for and how to use it, for tools and AI agents (see AGENTS.md).
# `import` paths and `check` ids are verified by tests/test_manifest.py.

[package]
name = "bazis-async-request"
summary = "run any HTTP request of the API in the background through Kafka (X-Async-Background)"
solves = [
    "move slow requests or bulk changes to the background without new endpoints",
    "restrict an endpoint to requests executed in the background",
    "route background requests to several Kafka topics (BAZIS_ASYNC_REQUEST_TOPIC_RESOLVER)",
    "queue only the requests of authenticated users (BAZIS_ASYNC_REQUEST_ALLOW_ANONYMOUS=false)",
]
requires = ["bazis", "bazis-async-background"]
pairs_well = ["bazis-users", "bazis-permit"]

[[extension_points]]
name = "AsyncRequestMiddleware"
import = "bazis.contrib.async_request.middleware.AsyncRequestMiddleware"
use_when = "add to the application: app.add_middleware(AsyncRequestMiddleware)"

[[extension_points]]
name = "require_async"
import = "bazis.contrib.async_request.utils.require_async"
use_when = "a dependency that allows an endpoint only for background requests (409 otherwise)"

[[extension_points]]
name = "is_internal_request"
import = "bazis.contrib.async_request.utils.is_internal_request"
use_when = "whether a request (ASGI scope) is executed by the consumer"

[[extension_points]]
name = "consumer_async_requests"
import = "bazis.contrib.async_request.tasks.consumer_async_requests"
use_when = "the consumer of the requests: list bazis.contrib.async_request.tasks in KAFKA_TASKS"

[[extension_points]]
name = "consumer_for_topic"
import = "bazis.contrib.async_request.consumers.consumer_for_topic"
use_when = "a consumer of a topic chosen by BAZIS_ASYNC_REQUEST_TOPIC_RESOLVER, in a module listed in KAFKA_TASKS (the module consumers registers nothing when imported, unlike tasks)"

[[pitfalls]]
text = "without Kafka settings the requests with X-Async-Background are executed synchronously"
check = "async_request.W001"

[[pitfalls]]
text = "without the route of bazis.contrib.async_background.router the middleware fails on every HTTP request"
check = "async_request.E001"

[[pitfalls]]
text = "BAZIS_ASYNC_REQUEST_TOPIC_RESOLVER must import to a callable(payload) -> str, or every request with X-Async-Background fails"
check = "async_request.E002"

[[pitfalls]]
text = "the resolver runs in the event loop for every queued request: no ORM or blocking I/O, decide from the payload"

[[pitfalls]]
text = "a topic returned by BAZIS_ASYNC_REQUEST_TOPIC_RESOLVER needs a consumer (consumer_for_topic in a KAFKA_TASKS module), or its requests stay pending"

[[pitfalls]]
text = "the middleware is not added automatically: app.add_middleware(AsyncRequestMiddleware)"

[[pitfalls]]
text = "by default any client queues tasks with an anonymous token it made up: set BAZIS_ASYNC_REQUEST_ALLOW_ANONYMOUS=false to queue only the session JWT of an active user"

[[pitfalls]]
text = "a header must never mark a request as internal: use is_internal_request(scope)"

[[pitfalls]]
text = "only JSON bodies are queued: multipart, form and binary bodies are replayed as {}"

[[pitfalls]]
text = "a dependency in an inject_make class without a type annotation is ignored"
